<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Đăng ký thi TN 2025</title>
    </head>
<body>
    <div>
        <h1>TẠO FORM</h1>
        <p> <h2 style="color: blue;">ĐĂNG KÝ THI TỐT NGHIỆP</h2></p>
        <hr>
        <form action = "#" method="post">
            <label for=" họ tên "> Họ và tên:</label>
            <input name="họ tên "type="text "size="50">
            <br>
            <label for= " ngày sinh "> ngày sinh:</label>
            <input name ="ngaysinh" type="date">
            <br>
            <label for = "Lựa chọn">Lựa chọn môn:</label>
            <select id="lựa chọn" name="Lựa chọn">
                <option value="Môn Toán">Toán</option>
                <option value="Môn Văn">Văn</option>
                <option value="Môn Hóa"  selected>Hóa</option>
            </select>
            <br>
            <label for="Địa chỉ">Địa chỉ</label>
            <textarea name="Địa chỉ" rows="10" cols="20"></textarea>
            <input type="submit" value="Hãy đăng ký">
            <input type="reset"  value="Làm lại">
        </form>
    </div>
    <hr>
</body>
</html>
